services:
  route-proxy:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ./working_proxies.txt:/input/working_proxies.txt:ro
      - ./working_proxies.json:/input/working_proxies.json:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
